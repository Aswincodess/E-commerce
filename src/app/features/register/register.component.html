<div class="min-h-screen bg-[#F7F3EC] flex items-center justify-center px-6 py-12">

    <div class="w-full max-w-md">

        <!-- Heading -->
        <div class="text-center mb-8">

            <h1 class="text-3xl font-semibold text-[#1C1C1C]">
                Create Account
            </h1>

            <p class="mt-2 text-sm text-gray-600">
                Create your account and start building your workspace.
            </p>

        </div>


        <!-- Registration Form -->
        <form [formGroup]="registerForm" (ngSubmit)="submit()" class="space-y-5">

            <!-- General Registration Error -->
            @if (registrationError) {

            <div class="rounded-lg border border-red-200
                           bg-red-50 px-4 py-3
                           text-sm text-red-600">
                {{ registrationError }}
            </div>

            }


            <!-- Name -->
            <app-form-input id="name" label="Full Name" type="text" placeholder="Enter your full name"
                formControlName="name" [invalid]="
                    registerForm.controls.name.invalid &&
                    registerForm.controls.name.touched
                " [errorMessage]="
                    registerForm.controls.name.hasError('required')
                        ? 'Name is required.'
                        : registerForm.controls.name.hasError('minlength')
                            ? 'Name must be at least 2 characters.'
                            : registerForm.controls.name.hasError('maxlength')
                                ? 'Name cannot exceed 20 characters.'
                                : 'Name can contain only letters and spaces.'
                "></app-form-input>


            <!-- Email -->
            <app-form-input id="email" label="Email Address" type="email" placeholder="Enter your email"
                formControlName="email" [invalid]="
                    registerForm.controls.email.invalid &&
                    registerForm.controls.email.touched
                " [errorMessage]="
                    registerForm.controls.email.hasError('required')
                        ? 'Email is required.'
                        : registerForm.controls.email.hasError('emailExists')
                            ? 'An account with this email already exists.'
                            : 'Please enter a valid email address.'
                "></app-form-input>


            <!-- Password -->
            <app-form-input id="password" label="Password" type="password" placeholder="Create a password"
                formControlName="password" [invalid]="
                    registerForm.controls.password.invalid &&
                    registerForm.controls.password.touched
                " [errorMessage]="
                    registerForm.controls.password.hasError('required')
                        ? 'Password is required.'
                        : registerForm.controls.password.hasError('minlength')
                            ? 'Password must be at least 8 characters.'
                            : 'Password must contain uppercase, lowercase, number and special character.'
                "></app-form-input>


            <!-- Confirm Password -->
            <app-form-input id="confirmPassword" label="Confirm Password" type="password"
                placeholder="Confirm your password" formControlName="confirmPassword" [invalid]="
                    registerForm.controls.confirmPassword.invalid &&
                    registerForm.controls.confirmPassword.touched
                " [errorMessage]="
                    registerForm.controls.confirmPassword.hasError('required')
                        ? 'Confirm password is required.'
                        : 'Passwords do not match.'
                "></app-form-input>


            <!-- Register Button -->
            <button type="submit" [disabled]="registerForm.invalid || isSubmitting" [class.bg-gray-900]="
                    registerForm.valid && !isSubmitting
                " [class.hover:bg-gray-800]="
                    registerForm.valid && !isSubmitting
                " [class.bg-gray-400]="
                    registerForm.invalid || isSubmitting
                " [class.cursor-not-allowed]="
                    registerForm.invalid || isSubmitting
                " class="w-full rounded-lg px-4 py-3
                       text-sm font-medium text-white
                       transition">

                @if (isSubmitting) {
                Creating Account...
                } @else {
                Create Account
                }

            </button>


            <!-- Login Link -->
            <p class="text-center text-sm text-gray-600">

                Already have an account?

                <a routerLink="/login" class="font-medium text-[#1C1C1C]
                           hover:underline">
                    Sign In
                </a>

            </p>

        </form>


        <!-- Footer -->
        <p class="mt-8 text-center text-xs text-gray-500">
            By creating an account, you agree to our terms and conditions.
        </p>

    </div>

</div>
