<section class="relative flex min-h-screen items-center justify-center overflow-hidden bg-[#F7F3EC] px-5 py-20 sm:px-8">

    <!-- Background decorations -->
    <div
        class="pointer-events-none absolute -right-32 -top-32 h-[480px] w-[480px] rounded-full border border-[#D4552B]/10">
    </div>
    <div
        class="pointer-events-none absolute -right-16 -top-16 h-[340px] w-[340px] rounded-full border border-[#D4552B]/10">
    </div>
    <div
        class="pointer-events-none absolute -bottom-40 -left-32 h-[450px] w-[450px] rounded-full border border-[#D4552B]/10">
    </div>

    <!-- Background glow -->
    <div
        class="pointer-events-none absolute left-1/2 top-1/2 h-[450px] w-[450px] -translate-x-1/2 -translate-y-1/2 rounded-full bg-white/70 blur-[100px]">
    </div>

    <!-- Content -->
    <div class="relative z-10 mx-auto w-full max-w-3xl text-center">

        <!-- Top label -->
        <div
            class="mb-10 inline-flex items-center gap-3 rounded-full border border-[#D4552B]/20 bg-white/70 px-5 py-3 shadow-sm backdrop-blur-sm">

            <span class="relative flex h-2.5 w-2.5">
                <span class="absolute h-full w-full animate-ping rounded-full bg-[#D4552B]/40"></span>
                <span class="relative h-2.5 w-2.5 rounded-full bg-[#D4552B]"></span>
            </span>

            <span class="text-[10px] font-bold uppercase tracking-[0.28em] text-[#D4552B] sm:text-xs">
                Error 404 — Page not found
            </span>
        </div>

        <!-- 404 number -->
        <div class="relative">

            <span
                class="pointer-events-none absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 select-none font-serif text-[clamp(11rem,32vw,22rem)] font-bold leading-none text-[#D4552B]/[0.035]">
                LOST
            </span>

            <h1
                class="relative select-none font-serif text-[clamp(9rem,27vw,17rem)] font-medium leading-[0.8] tracking-[-0.09em] text-[#1C1C1C]">
                4<span class="text-[#D4552B]">0</span>4
            </h1>

            <div class="mx-auto mt-9 flex items-center justify-center gap-2">
                <span class="h-[3px] w-8 rounded-full bg-[#D4552B]/30"></span>
                <span class="h-[3px] w-12 rounded-full bg-[#D4552B]"></span>
                <span class="h-[3px] w-8 rounded-full bg-[#D4552B]/30"></span>
            </div>
        </div>

        <!-- Heading -->
        <div class="mt-10 space-y-4">
            <h2 class="font-serif text-3xl font-medium tracking-tight text-[#1C1C1C] sm:text-5xl">
                Well, this is <span class="italic text-[#D4552B]">awkward.</span>
            </h2>

            <p class="mx-auto max-w-md text-sm leading-8 text-[#77716B] sm:text-base">
                Looks like this page has wandered off.
                The link might be broken, or the page may have moved.
                Let's find you something worth exploring.
            </p>
        </div>

        <!-- Actions -->
        <div class="mt-10 flex flex-col items-center justify-center gap-4 sm:flex-row">

            <!-- Home -->
            <a routerLink="/home"
                class="group flex min-h-[56px] w-full min-w-[200px] items-center justify-center gap-3 rounded-xl bg-[#1C1C1C] px-8 py-4 text-[11px] font-bold uppercase tracking-[0.17em] text-white shadow-lg shadow-black/10 transition-all duration-300 hover:-translate-y-1 hover:bg-[#D4552B] hover:shadow-xl hover:shadow-[#D4552B]/20 sm:w-auto">

                <svg class="h-4 w-4 transition-transform duration-300 group-hover:-translate-x-1" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>

                Back to Home
            </a>

            <!-- Go Back -->
            <button type="button" (click)="goBack()"
                class="flex min-h-[56px] w-full min-w-[200px] items-center justify-center gap-3 rounded-xl border border-[#1C1C1C]/15 bg-white/70 px-8 py-4 text-[11px] font-bold uppercase tracking-[0.17em] text-[#1C1C1C] transition-all duration-300 hover:-translate-y-1 hover:border-[#D4552B]/40 hover:bg-white sm:w-auto">

                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                </svg>

                Go Back
            </button>
        </div>

        <!-- Footer detail -->
        <div class="mt-16 flex items-center justify-center gap-4">
            <span class="h-px w-10 bg-[#D4552B]/25"></span>

            <p class="text-[9px] font-semibold uppercase tracking-[0.25em] text-[#A49B91] sm:text-[10px]">
                A little detour in your journey
            </p>

            <span class="h-px w-10 bg-[#D4552B]/25"></span>
        </div>

    </div>
</section>
