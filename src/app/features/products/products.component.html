<h2>Products</h2>

<button type="button" (click)="testClick()">
    TEST BUTTON
</button>

@if (loading$ | async) {
<p>Loading products...</p>
}

@if (error$ | async; as error) {
<p>{{ error }}</p>
}

@if (!(loading$ | async)) {
@for (product of products$ | async; track product.id) {
<div>
    <h3>{{ product.name }}</h3>
    <p>₹{{ product.price }}</p>
</div>

<button (click)="addToCart(product)">
    Add to Cart
</button>
}
}
