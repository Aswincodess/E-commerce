<div class="min-h-screen grid grid-cols-1 lg:grid-cols-2">

   
    <!-- LEFT SIDE : IMAGE -->
    <div class="hidden lg:block relative h-screen overflow-hidden bg-black">

        <img src="/images/office-login.svg" alt="DeskForge" class="w-full h-full object-fill" />

        <!-- Image overlay -->
        <div class="absolute inset-0 bg-black/20"></div>

        <!-- Text on image -->
        <div class="absolute bottom-12 left-12 max-w-md text-white">
        </div>

    </div>


    <!-- RIGHT SIDE : LOGIN -->
    <div class="flex min-h-screen items-center justify-center
           bg-white px-6 py-12">

        <div class="w-full max-w-md">

            <!-- HEADING -->
            <div class="mb-8">

                <h1 class="text-3xl font-bold tracking-tight text-gray-900">
                    Welcome Back
                </h1>

                <p class="mt-2 text-sm text-gray-500">
                    Sign in to continue to your account.
                </p>

            </div>


            <!-- LOGIN FORM -->
            <form [formGroup]="loginForm" (ngSubmit)="submit()" class="space-y-5">

                <!-- EMAIL -->
                <app-form-input id="email" label="Email" type="email" placeholder="Enter your email"
                    formControlName="email" [invalid]="
                    loginForm.controls.email.invalid &&
                    loginForm.controls.email.touched
                " [errorMessage]="
                    loginForm.controls.email.hasError('required')
                        ? 'Email is required.'
                        : 'Enter a valid email address.'
                "></app-form-input>


                <!-- PASSWORD -->
                <app-form-input id="password" label="Password" type="password" placeholder="Enter your password"
                    formControlName="password" [invalid]="
                    loginForm.controls.password.invalid &&
                    loginForm.controls.password.touched
                " [errorMessage]="
                    loginForm.controls.password.hasError('required')
                        ? 'Password is required.'
                        : loginForm.controls.password.hasError('minlength')
                            ? 'Password must be at least 8 characters.'
                            : 'Password must contain uppercase, lowercase, number and special character.'
                "></app-form-input>


                <!-- LOGIN ERROR -->
                @if (loginError) {

                <div class="rounded-xl border border-red-200
                           bg-red-50 px-4 py-3">

                    <p class="text-sm text-red-600">
                        {{ loginError }}
                    </p>

                </div>

                }


                <!-- SIGN IN BUTTON -->
                <button type="submit" [disabled]="loginForm.invalid || isSubmitting" class="w-full rounded-xl bg-black py-3.5
                       text-sm font-semibold text-white
                       transition hover:bg-gray-800
                       disabled:cursor-not-allowed
                       disabled:bg-gray-400">

                    @if (isSubmitting) {

                    Signing In...

                    } @else {

                    Sign In

                    }

                </button>

            </form>


            <!-- REGISTER LINK -->
            <p class="mt-6 text-center text-sm text-gray-500">

                Don't have an account?

                <a routerLink="/register" class="ml-1 font-semibold text-gray-900
                       hover:underline">
                    Create Account
                </a>

            </p>

        </div>

    </div>
   

</div>
