<div class="min-h-screen bg-[#F7F3EC] flex items-center justify-center px-4">

    <div class="w-full max-w-md">

        <!-- Header -->
        <div class="mb-8 text-center">

            <h1 class="text-3xl font-semibold text-[#1C1C1C]">
                Welcome Back
            </h1>

            <p class="mt-2 text-sm text-gray-500">
                Sign in to your DeskForge account
            </p>

        </div>


        <!-- Login Card -->
        <div class="rounded-2xl bg-white p-8 shadow-sm">

            <form
                [formGroup]="loginForm"
                (ngSubmit)="submit()"
                class="space-y-5">

                <!-- Email -->
                <app-form-input
                    label="Email"
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    formControlName="email"
                    [invalid]="
                        loginForm.controls.email.invalid &&
                        loginForm.controls.email.touched
                    "
                    [errorMessage]="
                        loginForm.controls.email.hasError('required')
                            ? 'Email is required.'
                            : loginForm.controls.email.hasError('email')
                            ? 'Enter a valid email address.'
                            : ''
                    ">
                </app-form-input>


                <!-- Password -->
                <app-form-input
                    label="Password"
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    formControlName="password"
                    [invalid]="
                        loginForm.controls.password.invalid &&
                        loginForm.controls.password.touched
                    "
                    [errorMessage]="
                        loginForm.controls.password.hasError('required')
                            ? 'Password is required.'
                            : loginForm.controls.password.hasError('minlength')
                            ? 'Password must be at least 8 characters.'
                            : loginForm.controls.password.hasError('pattern')
                            ? 'Password must contain uppercase, lowercase, number and special character.'
                            : ''
                    ">
                </app-form-input>


                <!-- Login Error -->
                @if (loginError) {

                    <div class="rounded-lg bg-red-50 px-4 py-3">

                        <p class="text-sm text-red-600">
                            {{ loginError }}
                        </p>

                    </div>

                }


                <!-- Login Button -->
                <button
                    type="submit"
                    [disabled]="isSubmitting"
                    class="w-full rounded-xl bg-[#D4552B] px-4 py-3 text-sm font-medium text-white transition hover:bg-[#B84421] disabled:cursor-not-allowed disabled:opacity-60">

                    {{ isSubmitting ? 'Logging in...' : 'Login' }}

                </button>

            </form>


            <!-- Register -->
            <div class="mt-6 text-center">

                <p class="text-sm text-gray-500">

                    Don't have an account?

                    <a
                        routerLink="/register"
                        class="font-medium text-[#D4552B] hover:text-[#B84421]">

                        Register

                    </a>

                </p>

            </div>

        </div>

    </div>

</div>
