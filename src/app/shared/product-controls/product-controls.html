<div class="w-full">


    <!-- MAIN TOOLBAR -->
    <div class="flex flex-col gap-5 border-y border-[#E3D5CC] py-5 md:flex-row md:items-center md:justify-between">

        <!-- Left -->
        <div>
            <p class="text-xs font-medium uppercase tracking-[0.2em] text-[#8A7367]">
                Filter & Sort
            </p>
        </div>


        <!-- Right Controls -->
        <div class="flex flex-wrap items-center gap-5">

            <!-- Category -->
            <div class="relative">

                <select #categorySelect (change)="setCategory(categorySelect.value)"
                    class="appearance-none min-w-[150px] cursor-pointer border-0 border-b border-[#BFAEA3] bg-transparent py-2 pr-7 text-sm text-[#2B2B2B] outline-none focus:border-[#D4552B] focus:ring-0">

                    <option value="">
                        All categories
                    </option>

                    <option value="Office Chairs">
                        Office Chairs
                    </option>

                    <option value="Desks">
                        Desks
                    </option>

                    <option value="Monitors">
                        Monitors
                    </option>

                    <option value="Laptops">
                        Laptops
                    </option>

                </select>

                <i
                    class="ti ti-chevron-down pointer-events-none absolute right-0 top-1/2 -translate-y-1/2 text-xs text-[#8A7367]">
                </i>

            </div>


            <!-- Price -->
            <div class="flex items-center gap-3">

                <span class="text-xs uppercase tracking-[0.15em] text-[#8A7367]">
                    Price
                </span>

                <div class="flex items-center border-b border-[#BFAEA3]">

                    <span class="text-sm text-[#8A7367]">
                        ₹
                    </span>

                    <input type="number" min="0" placeholder="Min" #minPrice (input)="setMinPrice(minPrice.value)"
                        [class.text-red-500]="minPriceError"
                        class="w-16 bg-transparent px-1 py-2 text-sm text-[#2B2B2B] outline-none">

                    <span class="px-1 text-[#8A7367]">
                        —
                    </span>

                    <input type="number" min="0" placeholder="Max" #maxPrice (input)="setMaxPrice(maxPrice.value)"
                        [class.text-red-500]="maxPriceError"
                        class="w-16 bg-transparent px-1 py-2 text-sm text-[#2B2B2B] outline-none">

                </div>

            </div>


            <!-- Sort -->
            <div class="relative">

                <select #sortSelect (change)="setSort(sortSelect.value)"
                    class="appearance-none min-w-[145px] cursor-pointer border-0 border-b border-[#BFAEA3] bg-transparent py-2 pr-7 text-sm text-[#2B2B2B] outline-none focus:border-[#D4552B] focus:ring-0">

                    <option value="">
                        Sort by
                    </option>

                    <option value="low-high">
                        Price: Low to High
                    </option>

                    <option value="high-low">
                        Price: High to Low
                    </option>

                </select>

                <i
                    class="ti ti-chevron-down pointer-events-none absolute right-0 top-1/2 -translate-y-1/2 text-xs text-[#8A7367]">
                </i>

            </div>

        </div>

    </div>


    <!-- PRICE ERROR -->
    @if (minPriceError || maxPriceError) {

    <p class="mt-2 text-right text-xs text-red-500">
        {{ minPriceError || maxPriceError }}
    </p>

    }


    <!-- ACTIVE FILTERS -->
    @if (activeFilters().length > 0) {

    <div class="flex flex-wrap items-center gap-4 border-b border-[#E3D5CC] py-3">

        <span class="text-xs uppercase tracking-[0.15em] text-[#8A7367]">
            Active
        </span>

        @for (filter of activeFilters(); track filter.key) {

        <button type="button" (click)="removeFilterByKey(filter.key)"
            class="group flex items-center gap-2 text-sm text-[#2B2B2B] transition hover:text-[#D4552B]">

            <span>
                {{ filter.label }}
            </span>

            <i class="ti ti-x text-xs text-[#8A7367] group-hover:text-[#D4552B]"></i>

        </button>

        }

        <button type="button" (click)="clearAllFilters()" class="text-xs font-medium text-[#A8421E] hover:underline">

            Clear all

        </button>

    </div>

    }
  

</div>
