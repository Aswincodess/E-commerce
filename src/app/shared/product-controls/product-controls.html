<div class="rounded-2xl border border-[#F3D4BE] bg-white p-4">

    <div class="flex flex-wrap items-center gap-3">

        <!-- Category -->

        <div class="relative">

            <select #categorySelect (change)="setCategory(categorySelect.value)"
                class="appearance-none cursor-pointer rounded-full border border-[#F3D4BE] bg-white px-4 py-2 pr-8 text-sm text-[#2B2B2B] outline-none focus:border-[#D4552B]">

                <option value="">
                    All categories
                </option>

                <option value="Office Chairs">
                    Office Chairs
                </option>

                <option value="Desks">
                    Desks
                </option>

                <option value="Monitors">
                    Monitors
                </option>

                <option value="Laptops">
                    Laptops
                </option>

            </select>

            <i
                class="ti ti-chevron-down pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-sm text-[#8A7367]">
            </i>

        </div>


        <!-- Price -->

        <div class="flex flex-col">

            <div class="flex items-center gap-2 rounded-full border border-[#F3D4BE] bg-white px-4 py-2">

                <span class="text-sm text-[#8A7367]">
                    ₹
                </span>

                <input type="number" min="0" placeholder="Min" #minPrice (input)="setMinPrice(minPrice.value)"
                    [class.text-red-500]="minPriceError"
                    class="w-16 bg-transparent text-sm text-[#2B2B2B] outline-none">

                <span class="text-[#8A7367]">
                    –
                </span>

                <input type="number" min="0" placeholder="Max" #maxPrice (input)="setMaxPrice(maxPrice.value)"
                    [class.text-red-500]="maxPriceError"
                    class="w-16 bg-transparent text-sm text-[#2B2B2B] outline-none">

            </div>


            @if (minPriceError || maxPriceError) {

            <p class="mt-2 px-3 text-xs text-red-500">
                {{ minPriceError || maxPriceError }}
            </p>

            }

        </div>


        <!-- Sort -->

        <div class="relative">

            <select #sortSelect (change)="setSort(sortSelect.value)"
                class="appearance-none cursor-pointer rounded-full border border-[#F3D4BE] bg-white px-4 py-2 pr-8 text-sm text-[#2B2B2B] outline-none focus:border-[#D4552B]">

                <option value="">
                    Sort by
                </option>

                <option value="low-high">
                    Price: Low to High
                </option>

                <option value="high-low">
                    Price: High to Low
                </option>

            </select>

            <i
                class="ti ti-chevron-down pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-sm text-[#8A7367]">
            </i>

        </div>

    </div>


    <!-- Active Filters -->

@if (activeFilters().length > 0) {

    <div class="mt-3 flex flex-wrap items-center gap-2 border-t border-[#F3D4BE] pt-3">

    @for (filter of activeFilters(); track filter.key) {
        <span class="flex items-center gap-1 rounded-full bg-[#D4552B] px-3 py-1 text-xs font-medium text-white">

            {{ filter.label }}

            <button type="button" (click)="removeFilterByKey(filter.key)" class="ml-1 hover:opacity-70">

                <i class="ti ti-x text-xs"></i>

            </button>

        </span>

        }


        <button type="button" (click)="clearAllFilters()" class="text-xs font-medium text-[#A8421E] hover:underline">

            Clear all

        </button>

    </div>

    }

</div>
