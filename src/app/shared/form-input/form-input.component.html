<div>

    <label
        [for]="id"
        class="mb-2 block text-sm font-medium text-black">
        {{ label }}
    </label>

    <div class="relative">

        <input
            [id]="id"
            [type]="type === 'password' && showPassword ? 'text' : type"
            [value]="value"
            [placeholder]="placeholder"
            [disabled]="disabled"
            [autocomplete]="autocomplete"
            (input)="handleInput($event)"
            (blur)="handleBlur()"
            class="w-full rounded-xl border px-4 py-3 pr-12 text-sm text-gray-900 outline-none transition focus:ring-1"
            [class.border-red-500]="invalid"
            [class.border-gray-300]="!invalid"
            [class.focus:border-red-500]="invalid"
            [class.focus:border-gray-900]="!invalid"
        />

        @if (type === 'password') {

            <button
                type="button"
                (click)="togglePassword()"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-900"
                [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            >

                @if (showPassword) {

                    <!-- Eye Off -->
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke-width="1.8"
                        stroke="currentColor"
                        class="h-5 w-5"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M3.98 8.223A10.477 10.477 0 0 0 2.25 12c1.5 4.5 5.75 7.5 9.75 7.5 1.414 0 2.773-.293 4-.825M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4 0 8.25 3 9.75 7.5a10.48 10.48 0 0 1-2.114 3.592M6.228 6.228 3 3m3.228 3.228 3.24 3.24m0 0a3 3 0 1 0 4.243 4.243M9.468 9.468 12 12m0 0 2.532 2.532M12 12l3.53 3.53M3 3l18 18"
                        />
                    </svg>

                } @else {

                    <!-- Eye -->
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke-width="1.8"
                        stroke="currentColor"
                        class="h-5 w-5"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M2.25 12s3.75-7.5 9.75-7.5 9.75 7.5 9.75 7.5-3.75 7.5-9.75 7.5S2.25 12 2.25 12Z"
                        />
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
                        />
                    </svg>

                }

            </button>

        }

    </div>

    @if (invalid && errorMessage) {

        <div class="mt-2 text-sm text-red-500">

            <p>
                {{ errorMessage }}
            </p>

        </div>

    }

</div>
