@if (toastservice.toast(); as toast) {
<div class="fixed top-5 right-5 z-[99999]
              flex items-center gap-3 w-[380px]
              max-w-[calc(100vw-2rem)]
              rounded-xl bg-black p-4
              border border-white/20
              shadow-xl
              animate-in slide-in-from-top-4 duration-300">

    <div class="flex h-10 w-10 shrink-0 items-center
                justify-center rounded-lg
                bg-white text-black font-bold text-xl">
        @if (toast.type === 'success') {
        ✓
        } @else {
        !
        }
    </div>

    <div class="flex-1 min-w-0">
        <p class="font-semibold text-white">
            {{ toast.type === 'success' ? 'Success!' : 'Error!' }}
        </p>

        <p class="mt-1 text-sm text-gray-300 break-words">
            {{ toast.message }}
        </p>
    </div>

    <span class="self-start text-gray-400 text-lg">
        ×
    </span>
</div>
}
