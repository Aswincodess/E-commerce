
@if (toastservice.toast(); as toast) {

<div class="fixed
               top-6
               right-6
               z-[9999]
               flex
               items-center
               gap-3
               rounded-xl
               bg-[#1C1C1C]
               px-5
               py-3.5
               text-sm
               font-medium
               text-white
               shadow-xl
               transition-all
               duration-300">

    @if (toast.type === 'success') {

    <span class="flex
                       h-6
                       w-6
                       items-center
                       justify-center
                       rounded-full
                       bg-white
                       text-[#1C1C1C]">
        ✓
    </span>

    } @else {

    <span class="flex
                       h-6
                       w-6
                       items-center
                       justify-center
                       rounded-full
                       bg-white
                       text-[#1C1C1C]">
        !
    </span>

    }

    <span>
        {{ toast.message }}
    </span>

</div>

}
