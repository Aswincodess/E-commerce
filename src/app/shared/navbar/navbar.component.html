<nav class="w-full border-b border-borderGreen/20" style="background-color: #f4efe6;">

    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">

        <!-- Logo -->
        <a routerLink="/" class="flex items-center gap-2">

            <span class="w-9 h-9 rounded-md bg-inkGreen flex items-center justify-center text-ivory text-lg font-bold">
                D
            </span>

            <span class="font-display text-xl font-semibold text-inkGreen">
                DeskForge
            </span>

        </a>


        <!-- Navigation Links -->
        <div class="hidden md:flex items-center gap-8">

            <a routerLink="/" routerLinkActive="text-oak font-semibold" [routerLinkActiveOptions]="{ exact: true }"
                class="text-[15px] font-medium tracking-wide text-inkGreen hover:text-oak transition">
                Home
            </a>

            <a routerLink="/products" routerLinkActive="text-oak font-semibold"
                class="text-[15px] font-medium tracking-wide text-inkGreen hover:text-oak transition">
                Shop
            </a>

            <a routerLink="/" fragment="categories"
                class="text-[15px] font-medium tracking-wide text-inkGreen hover:text-oak transition">
                Categories
            </a>

            <span class="text-[15px] font-medium tracking-wide text-inkGreen/50 cursor-not-allowed" title="Coming soon">
                Workspaces
            </span>

            <a routerLink="/custom-build"
                class="px-5 py-2.5 rounded-lg bg-inkGreen text-ivory text-sm font-semibold hover:opacity-90 transition">
                Custom Builder
            </a>

        </div>


        <!-- Right Side Icons -->
        <div class="flex items-center gap-5">

            <!-- Search -->
            <button type="button" class="text-inkGreen hover:text-oak transition" aria-label="Search">

                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8"
                    stroke="currentColor" class="w-5 h-5">

                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="m21 21-4.35-4.35m0 0A7.5 7.5 0 1 0 6.04 6.04a7.5 7.5 0 0 0 10.61 10.61Z" />

                </svg>

            </button>


            <!-- Wishlist -->
            <button type="button" class="text-inkGreen hover:text-oak transition" aria-label="Wishlist">

                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8"
                    stroke="currentColor" class="w-5 h-5">

                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />

                </svg>

            </button>


        <!-- Cart -->
    <!-- Cart -->
    <a routerLink="/cart" class="relative text-inkGreen hover:text-oak transition" aria-label="Shopping cart">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"
            class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round"
                d="M2.25 3h1.386c.51 0 .955.343 1.086.836L5.76 6.75m0 0h13.98c.87 0 1.5.82 1.27 1.66l-1.5 5.25a1.5 1.5 0 0 1-1.443 1.09H8.25a1.5 1.5 0 0 1-1.443-1.09L5.76 6.75Zm2.49 10.5h.008v.008H8.25v-.008Zm8.25 0h.008v.008H16.5v-.008ZM9 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm8.25 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1-1.5 0Z" />
        </svg>
    
        <span *ngIf="(cartCount$ | async) as count" class="absolute -top-2 -right-2 min-w-5 h-5 px-1
               flex items-center justify-center
               rounded-full bg-inkGreen text-ivory
               text-xs font-semibold">
            {{ count }}
        </span>
    </a>


            <!-- Logout -->
            <a routerLink="/login" (click)="logout()" class="text-inkGreen hover:text-oak transition" aria-label="Logout"
                title="Logout">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"
                    class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6A2.25 2.25 0 0 0 5.25 5.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3-3H9m9 0-3-3m3 3-3 3" />
                </svg>
            </a>


            <!-- Mobile Menu -->
            <button type="button" (click)="toggleMobileMenu()" class="md:hidden text-inkGreen" aria-label="Menu">

                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8"
                    stroke="currentColor" class="w-6 h-6">

                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />

                </svg>

            </button>

        </div>

    </div>


    <!-- Mobile Menu -->
    @if (isMobileMenuOpen()) {

    <div class="md:hidden border-t border-borderGreen/20 flex flex-col gap-4 p-6" style="background-color: #f4efe6;">

        <a routerLink="/" (click)="toggleMobileMenu()" routerLinkActive="font-semibold"
            [routerLinkActiveOptions]="{ exact: true }" class="text-sm text-inkGreen">
            Home
        </a>

        <a routerLink="/products" (click)="toggleMobileMenu()" routerLinkActive="font-semibold"
            class="text-sm text-inkGreen">
            Shop
        </a>

        <a routerLink="/" fragment="categories" (click)="toggleMobileMenu()" class="text-sm text-inkGreen">
            Categories
        </a>

        <span class="text-sm text-inkGreen/50">
            Workspaces (coming soon)
        </span>

        <a routerLink="/custom-build" (click)="toggleMobileMenu()" class="text-sm font-semibold text-inkGreen">
            Custom Builder
        </a>

    </div>

    }

</nav>
