<a [routerLink]="['/products']" [queryParams]="{ category: categoryKey() }"
    class="group relative block h-60 md:h-64 overflow-hidden rounded-2xl bg-[#1C1C1C]">

    <!-- Image -->
    <img [src]="image()" [alt]="name()" class="absolute inset-0 w-full h-full object-cover
               transition-transform duration-700 ease-out
               group-hover:scale-105" />

    <!-- Soft Dark Overlay -->
    <div class="absolute inset-0
               bg-gradient-to-t
               from-black/75
               via-black/25
               to-transparent"></div>

    <!-- Content -->
    <div class="absolute inset-x-0 bottom-0 p-6 md:p-7">

        <!-- Explore -->
        <p class="text-[11px] uppercase tracking-[0.25em]
                   text-white/70 mb-3">
            Explore
        </p>

        <!-- Category Name -->
        <div class="flex items-center justify-between gap-4">

            <h3 class="text-2xl md:text-3xl
                       font-display font-light
                       tracking-tight
                       text-white">
                {{ name() }}
            </h3>

            <!-- Arrow -->
            <span class="flex-shrink-0
                       w-10 h-10
                       rounded-full
                       border border-white/30
                       flex items-center justify-center
                       text-white
                       transition-all duration-300
                       group-hover:bg-white
                       group-hover:text-[#1C1C1C]
                       group-hover:border-white">
                →
            </span>

        </div>

        <!-- Description -->
        <p class="mt-2
                   text-sm
                   text-white/70
                   max-w-md
                   leading-relaxed">
            {{ description() }}
        </p>

    </div>

</a>
